<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{app.title}"></title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/users.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>

    <header id="header" th:insert="~{fragments/header :: header}">
    </header>

    <section class="users-section">

        <div class="users-card">

            <h1 id="users-title">Users</h1>

            <form class="table-top" th:action="@{/admin/users/username_id/search/mvc}" th:method="GET">

                <div class="search-box">
                    <input type="text" placeholder="Search" name="search" required/>
                </div>

                <div class="actions">
                    <button type="submit" class="filter-btn">
                        Search
                    </button>
                </div>

            </form>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Username</th>
                            <th>Edit</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="username_ID,userStat : ${allUsername_IDS}">
                            <td th:text="${userStat.count}"></td>
                            <td th:text="${username_ID.username}"></td>
                            <td>
                                <button class="edit-btn"><a th:href="@{/admin/user/update/mvc?id=}+''+${username_ID.id}">Edit</a></button>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </section>


    <footer th:insert="~{fragments/footer :: footer}">
    </footer>

    <script>

        const menuBtn = document.querySelector(".menu-button");
        const navMenu = document.querySelector("nav ul");

        menuBtn.addEventListener("click",()=>{
            navMenu.classList.toggle("show");
            myFunction(menuBtn);
        });

        document.querySelectorAll("nav ul li a").forEach(link=>{

            link.addEventListener("click",()=>{

                navMenu.classList.remove("show");
                menuBtn.innerHTML='<i class="fas fa-bars"></i>';

            });

        });

        function myFunction(x) {
            x.classList.toggle("change");
        }
    </script>
</body>
</html>
