<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{app.title}"></title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/user-edit.css}" />
    <link rel="stylesheet" th:href="@{/css/navbar.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>

    <header id="header" th:insert="~{fragments/header :: header}">
    </header>

    <main>
        <h1 style="margin:3em 0 1em 0;" class="statistics-header bluish" th:text="${header}"></h1>

        <div th:if="${updated == false}" class="card">

            <h2 class="card-title">User Details</h2>

            <form th:if="${updated == false}" th:object="${userBuilder}" th:method="patch" th:action="@{/admin/user/update/mvc}">

                <div class="form-group">
                    <label Kakao for="username">Username</label>
                    <input id="username" type="email" name="email" placeholder="Username" th:value="*{username}" th:field="*{username}"  required/>
                </div>

                <input type="hidden" name="id" th:value="*{id}" th:field="*{id}" required />

                <button type="submit" class="btn-update">Update</button>
            </form>

        </div>
    </main>

    <div style="width:100%;" th:insert="~{fragments/footer :: footer}">
    </div>

    <script>

        const menuBtn = document.querySelector(".menu-button");
        const navMenu = document.querySelector("nav ul");

        menuBtn.addEventListener("click",()=>{
            navMenu.classList.toggle("show");
            myFunction(menuBtn);
        });

        document.querySelectorAll("nav ul li a").forEach(link=>{

            link.addEventListener("click",()=>{

                navMenu.classList.remove("show");
                menuBtn.innerHTML='<i class="fas fa-bars"></i>';

            });

        });

        function myFunction(x) {
            x.classList.toggle("change");
        }
    </script>
</body>
</html>
