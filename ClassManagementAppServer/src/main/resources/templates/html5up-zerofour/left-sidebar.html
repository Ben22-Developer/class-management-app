    <script> 

        const ctx = document.getElementById('myChart');
        const javaData = JSON.parse(ctx.javaData.chart);
        const dataset = datasetFunction();
        const chart = new Chart(ctx, dataset);

        console.log(javaData);
        console.log(dataset);
        console.log(chart);

        function datasetFunction()
        {
            return {
                type: 'bar',
                data: {
                    labels: javaData.labels,
                    datasets: [{
                        label: 'Tokens to Date',
                        data: javaData.tokens,
                        backgroundColor: javaData.backgroundColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            };
        }

        function chartChange () {

            const selector = document.getElementById("my-selector");
            const selectedChartSpan = document.getElementById("selected-chart-span");

            if (selector.value === "Chart")
                return;

            dataset.type = selector.value + " chart";

            chart.update();

            selectedChartSpan.textContent=dataset.type;

        }

    </script>
